<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Favorit - Resto Modern</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" crossorigin href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#4CAF50",
            cta: "#FF9800",
            "background-light": "#F5F5F5",
            "background-secondary": "#FFFFFF",
            "text-primary": "#1F2937",
            "text-secondary": "#6B7280"
          },
          fontFamily: { display: ["Poppins", "sans-serif"] }
        }
      }
    };
  </script>

  <style>
    /* fallback aspect ratio */
    .pb-56-25{padding-bottom:56.25%}
  </style>
</head>
<body class="min-h-screen flex flex-col bg-background-light font-display text-text-primary">
  <div class="flex flex-col flex-1">
    <!-- Header -->
    <header class="sticky top-0 z-20 w-full border-b bg-background-light border-gray-200">
      <div class="container mx-auto flex h-20 items-center justify-between px-4 sm:px-6 lg:px-8">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-primary text-4xl">restaurant_menu</span>
          <h1 class="text-2xl font-bold">Resto Modern</h1>
        </div>

        <nav class="hidden md:flex items-center gap-6">
          <a class="text-base hover:text-primary" href="Menu.html">Menu</a>
          <a class="text-base hover:text-primary" href="Promo.html">Promo</a>
          <a class="text-base hover:text-primary" href="Menu_Favorit_Makanan.html">Favorit</a>
          <a class="text-base hover:text-primary" href="Bantuan.html">Bantuan</a>

          <a id="header-cart-link" aria-label="Keranjang Belanja" class="inline-flex items-center gap-2 hover:text-primary" href="cart.html">
            <span class="material-symbols-outlined text-2xl">shopping_cart</span>
          </a>
        </nav>

        <button id="menu-toggle" class="md:hidden p-2 rounded-md" aria-label="Buka menu">
          <span class="material-symbols-outlined text-3xl">menu</span>
        </button>

        <nav id="mobile-menu" class="hidden absolute right-4 top-full mt-2 w-56 rounded-xl border bg-white shadow-lg overflow-hidden md:hidden">
          <ul class="flex flex-col py-2">
            <li><a class="block px-4 py-2 hover:bg-gray-100" href="Menu.html">Menu</a></li>
            <li><a class="block px-4 py-2 hover:bg-gray-100" href="Promo.html">Promo</a></li>
            <li><a class="block px-4 py-2 hover:bg-gray-100" href="Menu_Favorit_Makanan.html">Favorit</a></li>
            <li><a class="block px-4 py-2 hover:bg-gray-100" href="Bantuan.html">Bantuan</a></li>
            <li><a class="flex items-center gap-2 px-4 py-2 hover:bg-gray-100" href="cart.html"><span class="material-symbols-outlined">shopping_cart</span>Keranjang</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Main -->
    <main class="container mx-auto p-4 flex-grow">
      <h2 class="text-3xl font-bold mb-4">Menu Favorit</h2>

      <!-- Search (single-line) -->
      <div class="mb-4">
        <label for="search" class="sr-only">Cari menu</label>
        <div class="relative max-w-xl">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 pointer-events-none">
            <span class="material-symbols-outlined">search</span>
          </span>
          <input id="search" type="search" autocomplete="off"
            class="w-full pl-11 pr-10 py-3 rounded-lg border border-gray-300 bg-white text-sm text-text-primary placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition"
            placeholder="Cari menu..." />
          <button id="search-clear" type="button" aria-label="Hapus pencarian"
            class="absolute inset-y-0 right-0 pr-2 flex items-center text-gray-400 hidden focus:outline-none">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
      </div>

      <!-- Categories (under search, centered row) -->
      <div class="mb-6">
        <div class="flex gap-3 flex-wrap">
          <button id="cat-all" data-cat="all" class="cat-btn inline-flex h-10 items-center justify-center rounded-full px-5 bg-primary text-white text-sm font-medium">Semua</button>
          <button data-cat="makanan" class="cat-btn inline-flex h-10 items-center justify-center rounded-full px-5 bg-background-secondary text-text-primary text-sm font-medium">Makanan</button>
          <button data-cat="minuman" class="cat-btn inline-flex h-10 items-center justify-center rounded-full px-5 bg-background-secondary text-text-primary text-sm font-medium">Minuman</button>
          <button data-cat="paket" class="cat-btn inline-flex h-10 items-center justify-center rounded-full px-5 bg-background-secondary text-text-primary text-sm font-medium">Paket</button>
          <button data-cat="snack" class="cat-btn inline-flex h-10 items-center justify-center rounded-full px-5 bg-background-secondary text-text-primary text-sm font-medium">Snack</button>
        </div>
      </div>

      <!-- Grid -->
      <div id="cards" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <!-- rendered by JS -->
      </div>
    </main>

    <footer class="w-full border-t border-gray-200 bg-background-secondary">
      <div class="container mx-auto px-4 py-6 text-sm text-text-secondary">© 2025 Resto Modern</div>
    </footer>
  </div>

  <!-- shared data -->
  <script src="data.js"></script>

  <script>
    /* helpers */
    function formatRp(n){ return 'Rp ' + Number(n||0).toLocaleString('id-ID'); }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function normalizeUrl(u){ if(!u) return ''; try{ let s=u.replace(/\\/g,'').trim(); for(let i=0;i<3;i++){try{const d=decodeURIComponent(s); if(d===s) break; s=d;}catch{break}}; const isAbs=/^[a-zA-Z][a-zA-Z\d+\-.]*:\/\//.test(s); return isAbs?encodeURI(s):s.split('/').map(p=>encodeURIComponent(p)).join('/'); }catch{return u} }

    /* cart storage */
    function readCart(){ try{return JSON.parse(localStorage.getItem('cart')||'[]')}catch{return[]} }
    function writeCart(v){ localStorage.setItem('cart', JSON.stringify(v)) }
    function findCartIndexById(cart,id){ return cart.findIndex(x=>x.id===id) }
    function hasInCart(id){ return findCartIndexById(readCart(), id) !== -1 }

    const MENU = window.MENU_DATA || {};
    const cardsEl = document.getElementById('cards');
    const catAllBtn = document.getElementById('cat-all');
    const catBtns = Array.from(document.querySelectorAll('.cat-btn'));
    const searchInput = document.getElementById('search');
    const searchClear = document.getElementById('search-clear');

    /* search UI */
    function updateSearchClearVisibility(){ if(!searchInput) return; const v=(searchInput.value||'').trim(); if(v.length) searchClear.classList.remove('hidden'); else searchClear.classList.add('hidden'); }
    searchClear?.addEventListener('click', ()=>{ searchInput.value=''; searchInput.focus(); updateSearchClearVisibility(); renderCards({q:'', category: currentCategory}); });
    searchInput?.addEventListener('input', ()=>{ updateSearchClearVisibility(); lastQ = searchInput.value; renderCards({ q: lastQ, category: currentCategory }); });
    searchInput?.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ searchInput.value=''; updateSearchClearVisibility(); renderCards({q:'', category: currentCategory}); } });

    function createCartLabel(){ const d=document.createElement('div'); d.className='absolute top-2 left-2 bg-primary text-white text-xs font-semibold px-2 py-0.5 rounded-full pointer-events-none'; d.textContent='Dalam keranjang'; return d; }

    function renderCards({ q = '', category = 'all' } = {}){
      const ql = (q||'').trim().toLowerCase();
      cardsEl.innerHTML = '';
      const items = Object.values(MENU).filter(it => it.isFavorite).filter(it => {
        if(category!=='all' && it.category!==category) return false;
        if(!ql) return true;
        return (it.title + ' ' + (it.desc||'')).toLowerCase().includes(ql);
      });
      if(items.length===0){ cardsEl.innerHTML = '<div class="col-span-full text-center text-text-secondary py-12">Tidak ada item favorit ditemukan</div>'; return; }
      const cart = readCart();
      items.forEach(item=>{
        const url = normalizeUrl(item.img||'');
        const art = document.createElement('article');
        art.className = 'group relative overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm hover:shadow-lg transition flex flex-col';
        art.innerHTML = `
          <a href="menu_detail.html?id=${encodeURIComponent(item.id)}" class="block flex flex-col h-full">
            <div class="relative w-full overflow-hidden bg-gray-100">
              <div class="${CSS && CSS.supports && CSS.supports('aspect-ratio:16/9') ? 'aspect-[16/9]' : 'pb-56-25'} w-full bg-center bg-cover">
                <img alt="${escapeHtml(item.title)}" loading="lazy" class="w-full h-full object-cover block" />
              </div>
            </div>
            <div class="p-4 flex flex-col flex-1">
              <h3 class="text-lg font-semibold">${escapeHtml(item.title)}</h3>
              <p class="text-sm text-text-secondary mt-1 break-words">${escapeHtml(item.desc||'')}</p>
              <div class="mt-auto flex items-center justify-between gap-3">
                <p class="text-lg font-bold whitespace-nowrap">${formatRp(item.price)}</p>
                <button class="add-btn inline-flex items-center gap-2 rounded-lg h-10 px-4 bg-cta text-white text-sm font-semibold" type="button">
                  <span class="material-symbols-outlined">add_shopping_cart</span>
                  Tambah
                </button>
              </div>
            </div>
          </a>`;
        cardsEl.appendChild(art);
        const imgEl = art.querySelector('img');
        imgEl.src = url;
        imgEl.addEventListener('error', ()=>{ try{ const dec=decodeURIComponent(imgEl.src); if(dec!==imgEl.src){ imgEl.src = dec; return; } }catch{} const wrap = imgEl.closest('div.w-full'); if(wrap) wrap.innerHTML = '<div class="flex items-center justify-center text-sm text-gray-400 w-full h-full">Gambar tidak ditemukan</div>'; });
        if(cart.find(c=>c.id===item.id)) art.querySelector('.relative')?.appendChild(createCartLabel());
      });

      // attach add handlers
      cardsEl.querySelectorAll('.add-btn').forEach(btn=>{
        btn.addEventListener('click', (e)=>{
          e.preventDefault(); e.stopPropagation();
          const article = btn.closest('article');
          const idParam = article?.querySelector('a')?.getAttribute('href')?.split('id=')[1];
          const id = idParam || article?.querySelector('h3')?.textContent?.trim().toLowerCase().replace(/\s+/g,'-');
          const title = article?.querySelector('h3')?.textContent?.trim() || 'Item';
          const priceText = article?.querySelector('.text-lg.font-bold')?.textContent || '';
          const price = parseInt((priceText||'').replace(/\D/g,'')) || 0;
          const imgSrc = article.querySelector('img')?.src || '';
          const cart = readCart();
          const idx = findCartIndexById(cart, id);
          if(idx===-1){ cart.push({id, title, price, qty:1, img: imgSrc}); writeCart(cart); const existing = article.querySelector('.absolute.top-2.left-2'); if(!existing) article.querySelector('.relative')?.appendChild(createCartLabel()); }
          else { cart[idx].qty = (Number(cart[idx].qty)||1)+1; cart[idx].img = cart[idx].img || imgSrc; writeCart(cart); }
          const toast = document.createElement('div'); toast.textContent = `${title} ditambahkan ke keranjang`; toast.className = 'fixed bottom-6 right-6 rounded-lg bg-black/80 text-white px-4 py-2 shadow-lg'; document.body.appendChild(toast); setTimeout(()=>toast.remove(),1400);
          updateCartCountIndicator();
        });
      });
    }

    /* categories active */
    const allCategoryButtons = [catAllBtn].concat(catBtns);
    function setActiveCategoryButton(cat){
      allCategoryButtons.forEach(b=>{ b.classList.remove('bg-primary','text-white'); b.classList.add('bg-background-secondary','text-text-primary'); });
      if(cat==='all'){ catAllBtn.classList.remove('bg-background-secondary','text-text-primary'); catAllBtn.classList.add('bg-primary','text-white'); }
      else { const match = catBtns.find(b => (b.dataset?.cat||'') === cat); if(match){ match.classList.remove('bg-background-secondary','text-text-primary'); match.classList.add('bg-primary','text-white'); } }
    }

    /* header badge */
    function updateCartCountIndicator(){
      const cart = readCart(); const cnt = cart.reduce((s,x)=>s+(Number(x.qty)||0),0);
      const headerCartLink = document.getElementById('header-cart-link');
      if(!headerCartLink) return;
      let badge = headerCartLink.querySelector('#header-cart-badge');
      if(!badge){ badge = document.createElement('span'); badge.id='header-cart-badge'; badge.className='hidden items-center justify-center bg-red-600 text-white text-xs font-semibold rounded-full px-2 h-5'; headerCartLink.insertBefore(badge, headerCartLink.firstChild); }
      if(cnt>0){ badge.textContent = cnt>99?'99+':String(cnt); badge.classList.remove('hidden'); } else { badge.textContent=''; badge.classList.add('hidden'); }
    }
    (function initHeaderCartBadge(){ const headerCartLink=document.getElementById('header-cart-link'); if(!headerCartLink) return; headerCartLink.classList.add('inline-flex','items-center','gap-2'); updateCartCountIndicator(); })();

    /* init & wiring */
    let currentCategory = 'all';
    setActiveCategoryButton(currentCategory);
    updateSearchClearVisibility();
    let lastQ = '';
    renderCards({ q:'', category: currentCategory });

    catAllBtn.addEventListener('click', ()=>{ currentCategory='all'; setActiveCategoryButton(currentCategory); renderCards({ q: lastQ, category: currentCategory }); });
    catBtns.forEach(btn=> btn.addEventListener('click', ()=>{ const cat = btn.dataset?.cat||'all'; currentCategory=cat; setActiveCategoryButton(currentCategory); renderCards({ q: lastQ, category: currentCategory }); }));

    const menuToggle = document.getElementById('menu-toggle'); const mobileMenu = document.getElementById('mobile-menu');
    menuToggle?.addEventListener('click',(e)=>{ e.stopPropagation(); mobileMenu.classList.toggle('hidden'); });
    document.addEventListener('click', (e)=>{ if(mobileMenu && !mobileMenu.contains(e.target) && !menuToggle.contains(e.target)) mobileMenu.classList.add('hidden'); });
    document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') mobileMenu.classList.add('hidden'); });

    window.addEventListener('storage', (e)=>{ if(e.key==='cart'){ renderCards({ q: lastQ, category: currentCategory }); updateCartCountIndicator(); } });

    // debug
    window.MENU = MENU;
  </script>
</body>
</html>
