<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Detail Menu - Resto Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            min-height: 100dvh;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col bg-background-light font-sans text-text-primary"
    style="--tw-bg-opacity:1; --tw-bg:#ffffff;">
    <header class="sticky top-0 z-20 w-full border-b border-gray-200 bg-white">
        <div class="container mx-auto flex h-16 items-center justify-between px-4 sm:px-6 lg:px-8">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-primary text-3xl">restaurant_menu</span>
                <h1 class="text-lg font-semibold">Resto Modern</h1>
            </div>
            <a href="index.html" class="text-text-secondary hover:text-primary">Kembali</a>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div id="root" class="max-w-3xl mx-auto"></div>
    </main>

    <footer class="w-full border-t border-gray-200 bg-background-secondary">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="flex flex-col md:flex-row justify-between items-center text-center md:text-left gap-4">
                <div class="text-sm text-text-secondary">
                    <p class="font-semibold text-text-primary">Resto Modern</p>
                    <p>Jl. Teknologi No. 1, Jakarta, Indonesia</p>
                </div>
                <div class="flex gap-6 text-sm">
                    <a class="text-text-secondary hover:text-primary" href="Bantuan.html">Bantuan</a>
                    <a class="text-text-secondary hover:text-primary" href="FAQ.html">FAQ</a>
                </div>
                <p class="text-sm text-text-secondary">© 2025 Smart Ordering System. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        // ----- Dummy data (ganti dengan API/backend production) -----
        const MENU_DATA = {
            "salad-segar": {
                id: "salad-segar",
                title: "Salad Sayur",
                price: 25000,
                img: "Img/Salad.png",
                desc: "Campuran sayuran segar dengan dressing spesial.",
                sauces: [
                    { key: "madu", label: "Madu", price: 0 },
                    { key: "mayonaise", label: "Mayonaise", price: 0 }
                ],
                additions: [
                    { key: "extra-telur", label: "Extra Telur", price: 5000 },
                    { key: "tambahan-daging", label: "Tambahan Daging", price: 5000 }
                ]
            },

            "pizza-pepperoni": {
                id: "pizza-pepperoni",
                title: "Pizza Pepperoni",
                price: 85000,
                img: "Img/Pizza\ Peperoni.png",
                desc: "Pizza klasik dengan topping pepperoni dan keju mozzarella.",
                sauces: [{ key: "oregano", label: "Oregano", price: 0 }],
                additions: [{ key: "extra-cheese", label: "Extra Cheese", price: 10000 }]
            },

            "pancake-madu": {
                id: "pancake-madu",
                title: "Pancake Madu",
                price: 45000,
                img: "Img/pancakemadu.png",
                desc: "Pancake lembut dengan siraman madu asli dan buah berry segar.",
                // Tidak ada pilihan saus dan tidak ada tambahan: gunakan array kosong
                sauces: [],
                additions: []
            },

            "ramen-kuah-pedas": {
                id: "ramen-kuah-pedas",
                title: "Ramen Kuah Pedas",
                price: 65000,
                img: "Img/Ramen.png",
                desc: "Mie Ramen dengan kuah kaldu gurih dan pedas di tambah dengan toping lengkap,",
                sauces: [],
                additions: []
            },

            "nasi-goreng-spesial": {
                id: "nasi-goreng-spesial",
                title: "Nasi Goreng Spesial",
                price: 50000,
                img: "Img/Nasi Goreng Spesial.png",
                desc: "Nasi Goreng spesial dengan suwiran ayam, udang, dan telur mata sapi",
                sauces: [],
                additions: []
            },

            "spaghetti-carbonara": {
                id: "spaghetti-carbonara",
                title: "Spaghetti Carbonara",
                price: 75000,
                img: "Img/Spaghetti Carbonara.png",
                desc: "Pasta dengan saur carbonara creamy dan potongan smoked beef yang lezat",
                sauces: [],
                additions: []
            },

            "burger-klasik": {
                id: "burger-klasik",
                title: "Burger Klasik",
                price: 60000,
                img: "Img/Classic Burger.png",
                desc: "Burger daging sapi dengan tambahan selada, keju dan saur mayo yang lezat",
                sauces: [],
                additions: []
            }
        };


        // ----- Helpers -----
        function formatRp(n) {
            return 'Rp' + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        }

        function getQueryParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        // ----- Render -----
        const root = document.getElementById('root');
        const id = getQueryParam('id');

        if (!id || !MENU_DATA[id]) {
            root.innerHTML = `
        <div class="rounded-xl border border-gray-200 bg-white p-6 text-center">
          <h2 class="text-xl font-semibold mb-2">Item tidak ditemukan</h2>
          <p class="text-text-secondary mb-4">ID: ${id ?? '—'}</p>
          <a href="index.html" class="inline-block px-4 py-2 rounded-lg bg-primary text-white">Kembali ke Menu</a>
        </div>`;
        } else {
            const item = MENU_DATA[id];

            root.innerHTML = `
      <div class="bg-white rounded-xl shadow-sm overflow-hidden">
        <div class="md:flex">
          <!-- Gambar -->
          <div class="md:w-1/2 w-full">
            <img id="product-image" src="${item.img}" alt="${item.title}" class="w-full h-56 md:h-full object-cover">
          </div>

          <!-- Konten kanan -->
          <div class="md:w-1/2 w-full p-6">
            <h1 class="text-2xl font-bold text-text-primary">${item.title}</h1>
            <p id="base-price" class="mt-2 text-xl font-extrabold text-text-primary">${formatRp(item.price)}</p>
            <p class="mt-3 text-text-secondary">${item.desc}</p>

            <!-- Pilihan Saus (radio) -->
            <div class="mt-6">
              <h4 class="font-medium text-text-primary">Pilihan Saus</h4>
              <div id="sauce-options" class="mt-2 space-y-2">
                ${item.sauces.map((s, idx) => `
                  <label class="flex items-center gap-3">
                    <input type="radio" name="sauce" value="${s.key}" ${idx === 0 ? 'checked' : ''} class="sauce-radio h-4 w-4" />
                    <span class="text-text-primary">${s.label}</span>
                    ${s.price ? `<span class="ml-auto text-text-secondary text-sm">+ ${formatRp(s.price)}</span>` : ''}
                  </label>
                `).join('')}
              </div>
            </div>

            <!-- Tambahan (checkbox) -->
            <div class="mt-5">
              <h4 class="font-medium text-text-primary">Tambahan</h4>
              <div id="addition-options" class="mt-2 space-y-2">
                ${item.additions.map(a => `
                  <label class="flex items-center gap-3">
                    <input type="checkbox" name="addition" value="${a.key}" data-price="${a.price}" class="addition-checkbox h-4 w-4" />
                    <span class="text-text-primary">${a.label}</span>
                    <span class="ml-auto text-text-secondary text-sm">+ ${formatRp(a.price)}</span>
                  </label>
                `).join('')}
              </div>
            </div>

            <!-- Quantity + Total + Button -->
            <div class="mt-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
              <div class="flex items-center gap-3">
                <button id="qty-decrease" class="h-10 w-10 rounded-lg bg-gray-100 flex items-center justify-center text-xl">−</button>
                <input id="qty" type="number" value="1" min="1" class="w-16 text-center rounded-lg border border-gray-200 px-2 py-2" />
                <button id="qty-increase" class="h-10 w-10 rounded-lg bg-gray-100 flex items-center justify-center text-xl">+</button>
              </div>

              <div class="flex-1 flex items-center justify-between gap-4">
                <div>
                  <p class="text-sm text-text-secondary">Total</p>
                  <p id="total-price" class="text-lg font-bold text-text-primary">${formatRp(item.price)}</p>
                </div>

                <button id="add-to-cart" class="flex items-center gap-2 bg-cta text-white px-4 py-3 rounded-lg font-semibold hover:bg-orange-600">
                  <span class="material-symbols-outlined">add_shopping_cart</span>
                  <span>Tambah Ke Keranjang</span>
                </button>
              </div>
            </div>

            <p id="feedback" class="mt-3 text-sm text-green-600 hidden"></p>
          </div>
        </div>
      </div>
      `;

            // ----- Interaction logic -----
            const qtyInput = document.getElementById('qty');
            const qtyInc = document.getElementById('qty-increase');
            const qtyDec = document.getElementById('qty-decrease');
            const totalEl = document.getElementById('total-price');
            const addToCartBtn = document.getElementById('add-to-cart');
            const feedback = document.getElementById('feedback');

            // compute total
            function computeTotal() {
                const base = item.price;
                const qty = Math.max(1, parseInt(qtyInput.value || '1', 10));
                // selected additions
                const additions = Array.from(document.querySelectorAll('.addition-checkbox'))
                    .filter(ch => ch.checked)
                    .map(ch => parseInt(ch.dataset.price || '0', 10));
                const additionsSum = additions.reduce((s, v) => s + v, 0);
                const total = (base + additionsSum) * qty;
                totalEl.textContent = formatRp(total);
                return { total, qty, additionsSum };
            }

            // wire events
            qtyInc.addEventListener('click', () => {
                qtyInput.value = String(Math.max(1, parseInt(qtyInput.value || '1', 10) + 1));
                computeTotal();
            });
            qtyDec.addEventListener('click', () => {
                qtyInput.value = String(Math.max(1, parseInt(qtyInput.value || '1', 10) - 1));
                computeTotal();
            });
            qtyInput.addEventListener('change', () => {
                if (!qtyInput.value || parseInt(qtyInput.value, 10) < 1) qtyInput.value = '1';
                computeTotal();
            });

            // recalc when additions change
            document.querySelectorAll('.addition-checkbox').forEach(ch => {
                ch.addEventListener('change', computeTotal);
            });

            // optional: sauces can change price if defined (here zero)
            document.querySelectorAll('.sauce-radio').forEach(r => r.addEventListener('change', computeTotal));

            // initial compute
            computeTotal();

            // add to cart: example stores in localStorage cart array
            addToCartBtn.addEventListener('click', () => {
                const { total, qty, additionsSum } = computeTotal();
                // collect selected options
                const selectedSauceEl = document.querySelector('.sauce-radio:checked');
                const selectedSauce = selectedSauceEl ? selectedSauceEl.value : null;
                const selectedAdditions = Array.from(document.querySelectorAll('.addition-checkbox'))
                    .filter(ch => ch.checked)
                    .map(ch => ch.value);

                const cartItem = {
                    id: item.id,
                    title: item.title,
                    price: item.price,
                    qty,
                    additions: selectedAdditions,
                    sauce: selectedSauce,
                    unitAdditionsPrice: additionsSum,
                    total
                };

                // save to localStorage
                const cart = JSON.parse(localStorage.getItem('cart') || '[]');
                cart.push(cartItem);
                localStorage.setItem('cart', JSON.stringify(cart));

                // feedback toast / message
                feedback.textContent = 'Berhasil ditambahkan ke keranjang';
                feedback.classList.remove('hidden');
                setTimeout(() => feedback.classList.add('hidden'), 1600);

                // small visual toast
                const toast = document.createElement('div');
                toast.textContent = `${item.title} ditambahkan (${qty})`;
                toast.className = 'fixed bottom-6 right-6 rounded-lg bg-black/80 text-white px-4 py-2 shadow-lg';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 1600);
            });
        }
    </script>
</body>

</html>
