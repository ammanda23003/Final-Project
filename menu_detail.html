<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Detail Menu - Resto Modern</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <style>
    :root{
      --bg-light:#ffffff;
      --bg-secondary:#F5F5F5;
      --primary:#4CAF50;
      --cta:#FF9800;
      --text-primary:#1F2937;
      --text-secondary:#6B7280;
    }
    body { font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background: var(--bg-secondary); color: var(--text-primary); min-height:100dvh; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .container { max-width: 1024px; margin-left:auto; margin-right:auto; padding-left:1rem; padding-right:1rem; }
    .muted { color:var(--text-secondary); }
    .card { background:var(--bg-light); border-radius: .75rem; box-shadow: 0 1px 2px rgba(0,0,0,0.04); border:1px solid rgba(0,0,0,0.04); }
    .option-row { display:flex; align-items:center; gap:.75rem; padding:.5rem .5rem; border-radius:.5rem; }
    .option-row:hover { background: #f8faf8; }
    .price-tag { font-weight:700; color:var(--text-primary); }
  </style>
</head>
<body>
  <header class="sticky top-0 z-20 w-full border-b border-gray-200 bg-white">
    <div class="container flex h-16 items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-primary" style="color:var(--primary); font-size:28px;">restaurant_menu</span>
        <h1 class="text-lg font-semibold">Resto Modern</h1>
      </div>
      <a href="Menu.html" class="text-text-secondary hover:text-primary">Kembali</a>
    </div>
  </header>

  <main class="container py-6">
    <div id="root" class="max-w-3xl mx-auto"></div>
  </main>

  <footer class="w-full border-t border-gray-200 bg-background-secondary">
    <div class="container py-8">
      <div class="flex flex-col md:flex-row justify-between items-center text-center md:text-left gap-4">
        <div class="text-sm muted">
          <p class="font-semibold">Resto Modern</p>
          <p>Jl. Teknologi No. 1, Jakarta, Indonesia</p>
        </div>
        <div class="flex gap-6 text-sm">
          <a class="muted hover:text-primary" href="Bantuan.html">Bantuan</a>
          <a class="muted hover:text-primary" href="FAQ.html">FAQ</a>
        </div>
        <p class="text-sm muted">© 2025 Smart Ordering System. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- Pastikan data.js ada di root dan mendefinisikan window.MENU_DATA -->
  <script src="data.js"></script>

  <script>
    // Helpers
    function formatRp(n){ return 'Rp ' + Number(n || 0).toLocaleString('id-ID'); }
    function getQueryParam(name){ return new URLSearchParams(window.location.search).get(name); }
    function safeSrc(src){ if(!src) return ''; try { return encodeURI(src.replace(/\\/g,'')); } catch { return src; } }

    (function(){
      const root = document.getElementById('root');
      const id = getQueryParam('id');

      // Wait until window.MENU_DATA is available
      function initWhenReady(){
        if (typeof window.MENU_DATA === 'undefined'){
          setTimeout(initWhenReady, 50);
          return;
        }
        render();
      }

      function normalizeFieldToArray(obj, fieldNames){
        fieldNames.forEach(fn => {
          if (!obj[fn]) { obj[fn] = []; return; }
          if (Array.isArray(obj[fn])) return;
          if (typeof obj[fn] === 'string') {
            // comma separated or single string
            obj[fn] = obj[fn].split(',').map(s => s.trim()).filter(Boolean).map(s => ({ label: s, key: s, price: 0 }));
          } else {
            // convert object to array
            obj[fn] = [obj[fn]];
          }
        });
      }

      function render(){
        const data = window.MENU_DATA || {};
        if (!id || !data[id]){
          root.innerHTML = `
            <div class="card p-6 text-center">
              <h2 class="text-xl font-semibold mb-2">Item tidak ditemukan</h2>
              <p class="muted mb-4">ID: ${id ?? '—'}</p>
              <a href="Menu.html" class="inline-block px-4 py-2 rounded-lg bg-primary text-white">Kembali ke Menu</a>
            </div>`;
          return;
        }

        // Use the item from MENU_DATA
        const item = JSON.parse(JSON.stringify(data[id])); // clone to avoid mutating global

        // Support multiple field names and normalize to arrays of objects { key, label, price, desc? }
        if (!item.sauces && item.sauce) item.sauces = item.sauce;
        if (!item.toppings && item.topping) item.toppings = item.topping;
        if (!item.additions && item.extras) item.additions = item.extras;
        if (!item.additions && item.addons) item.additions = item.addons;

        // Normalize: if array of strings -> convert to objects; if array of objects keep as is
        function normalizeList(list){
          if (!list) return [];
          return list.map((it, idx) => {
            if (typeof it === 'string') return { key: it.replace(/\s+/g,'-').toLowerCase(), label: it, price: 0 };
            if (typeof it === 'number') return { key: 'opt-'+idx, label: String(it), price: 0 };
            // object: try to map common keys
            return {
              key: it.key || it.id || (it.label ? it.label.replace(/\s+/g,'-').toLowerCase() : ('opt-'+idx)),
              label: it.label || it.name || it.title || it.key || it.id || ('Option '+(idx+1)),
              price: Number(it.price || it.cost || 0),
              desc: it.desc || it.description || ''
            };
          });
        }

        const sauces = normalizeList(item.sauces || item.toppings || []);
        const additions = normalizeList(item.additions || []);

        // Determine label for primary options: for drinks use "Topping", otherwise "Pilihan Saus"
        const category = (item.category || '').toString().toLowerCase();
        const isDrink = category.includes('minum') || category.includes('drink') || category.includes('beverage');
        const primaryLabel = isDrink ? 'Topping' : 'Pilihan Saus';
        const primaryOptions = sauces;

        // Build HTML
        root.innerHTML = `
          <div class="card overflow-hidden">
            <div class="md:flex">
              <div class="md:w-1/2 w-full">
                <img id="product-image" src="${safeSrc(item.img || '')}" alt="${item.title || ''}" class="w-full h-56 md:h-full object-cover" />
              </div>

              <div class="md:w-1/2 w-full p-6">
                <h1 class="text-2xl font-bold">${item.title || ''}</h1>
                <p id="base-price" class="mt-2 text-xl font-extrabold">${formatRp(item.price)}</p>
                <p class="mt-3 muted">${item.desc || ''}</p>

                <div class="mt-6">
                  <h4 class="font-medium">${primaryLabel}</h4>
                  <div id="primary-options" class="mt-2 space-y-2"></div>
                </div>

                <div class="mt-5">
                  <h4 class="font-medium">Tambahan</h4>
                  <div id="addition-options" class="mt-2 space-y-2"></div>
                </div>

                <div class="mt-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                  <div class="flex items-center gap-3">
                    <button id="qty-decrease" class="h-10 w-10 rounded-lg bg-gray-100 flex items-center justify-center text-xl">−</button>
                    <input id="qty" type="number" value="1" min="1" class="w-16 text-center rounded-lg border border-gray-200 px-2 py-2" />
                    <button id="qty-increase" class="h-10 w-10 rounded-lg bg-gray-100 flex items-center justify-center text-xl">+</button>
                  </div>

                  <div class="flex-1 flex items-center justify-between gap-4">
                    <div>
                      <p class="text-sm muted">Total</p>
                      <p id="total-price" class="text-lg font-bold">${formatRp(item.price)}</p>
                    </div>

                    <button id="add-to-cart" class="flex items-center gap-2 bg-cta text-white px-4 py-3 rounded-lg font-semibold hover:bg-orange-600">
                      <span class="material-symbols-outlined">add_shopping_cart</span>
                      <span>Tambah Ke Keranjang</span>
                    </button>
                  </div>
                </div>

                <p id="feedback" class="mt-3 text-sm text-green-600 hidden"></p>
              </div>
            </div>
          </div>
        `;

        // Populate primary options (radio)
        const primaryContainer = document.getElementById('primary-options');
        if (!primaryOptions || primaryOptions.length === 0){
          primaryContainer.innerHTML = '<div class="muted">Tidak ada pilihan</div>';
        } else {
          primaryContainer.innerHTML = '';
          primaryOptions.forEach((opt, idx) => {
            const idRadio = `primary-${opt.key}`;
            const row = document.createElement('label');
            row.className = 'option-row';
            row.innerHTML = `
              <input type="radio" name="primary-opt" value="${opt.key}" id="${idRadio}" ${idx===0 ? 'checked' : ''} class="h-4 w-4" />
              <div class="flex-1 min-w-0">
                <div class="truncate">${opt.label}</div>
                ${opt.desc ? `<div class="muted text-xs">${opt.desc}</div>` : ''}
              </div>
              ${opt.price ? `<div class="price-tag">${formatRp(opt.price)}</div>` : ''}
            `;
            primaryContainer.appendChild(row);
          });
        }

        // Populate additions (checkbox)
        const additionContainer = document.getElementById('addition-options');
        if (!additions || additions.length === 0){
          additionContainer.innerHTML = '<div class="muted">Tidak ada tambahan</div>';
        } else {
          additionContainer.innerHTML = '';
          additions.forEach((a, idx) => {
            const idChk = `add-${a.key}`;
            const row = document.createElement('label');
            row.className = 'option-row';
            row.innerHTML = `
              <input type="checkbox" name="addition" value="${a.key}" id="${idChk}" data-price="${a.price || 0}" class="h-4 w-4" />
              <div class="flex-1 min-w-0">
                <div class="truncate">${a.label}</div>
                ${a.desc ? `<div class="muted text-xs">${a.desc}</div>` : ''}
              </div>
              <div class="price-tag">${formatRp(a.price || 0)}</div>
            `;
            additionContainer.appendChild(row);
          });
        }

        // Interaction logic
        const qtyInput = document.getElementById('qty');
        const qtyInc = document.getElementById('qty-increase');
        const qtyDec = document.getElementById('qty-decrease');
        const totalEl = document.getElementById('total-price');
        const addToCartBtn = document.getElementById('add-to-cart');
        const feedback = document.getElementById('feedback');
        const productImage = document.getElementById('product-image');

        productImage.addEventListener('error', () => {
          productImage.style.display = 'none';
          const wrap = productImage.parentElement;
          if (wrap) wrap.innerHTML = '<div class="w-full h-56 md:h-full bg-gray-100 flex items-center justify-center text-sm text-gray-400">Gambar tidak ditemukan</div>';
        });

        function computeTotal(){
          const base = Number(item.price || 0);
          const qty = Math.max(1, parseInt(qtyInput.value || '1', 10));
          // primary option price
          let primaryPrice = 0;
          const sel = document.querySelector('input[name="primary-opt"]:checked');
          if (sel){
            const val = sel.value;
            const found = primaryOptions.find(o => o.key === val);
            if (found) primaryPrice = Number(found.price || 0);
          }
          // additions sum
          const additionsSum = Array.from(document.querySelectorAll('input[name="addition"]'))
            .filter(ch => ch.checked)
            .map(ch => Number(ch.dataset.price || 0))
            .reduce((s,v) => s+v, 0);

          const unitPrice = base + primaryPrice + additionsSum;
          const total = unitPrice * qty;
          totalEl.textContent = formatRp(total);
          return { total, qty, unitPrice, additionsSum, primaryPrice };
        }

        qtyInc.addEventListener('click', () => { qtyInput.value = String(Math.max(1, parseInt(qtyInput.value||'1',10)+1)); computeTotal(); });
        qtyDec.addEventListener('click', () => { qtyInput.value = String(Math.max(1, parseInt(qtyInput.value||'1',10)-1)); computeTotal(); });
        qtyInput.addEventListener('change', () => { if (!qtyInput.value || parseInt(qtyInput.value,10) < 1) qtyInput.value = '1'; computeTotal(); });

        document.querySelectorAll('input[name="addition"]').forEach(ch => ch.addEventListener('change', computeTotal));
        document.querySelectorAll('input[name="primary-opt"]').forEach(r => r.addEventListener('change', computeTotal));

        computeTotal();

        addToCartBtn.addEventListener('click', () => {
          const { total, qty, unitPrice } = computeTotal();
          const selectedPrimary = document.querySelector('input[name="primary-opt"]:checked');
          const selectedPrimaryVal = selectedPrimary ? selectedPrimary.value : null;
          const selectedAdditions = Array.from(document.querySelectorAll('input[name="addition"]')).filter(ch => ch.checked).map(ch => ch.value);

          const cartItem = {
            id: item.id,
            title: item.title,
            price: unitPrice,
            qty: qty,
            img: item.img || '',
            primary: selectedPrimaryVal,
            additions: selectedAdditions
          };

          try {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            // merge if same id + same options
            let merged = false;
            for (let i=0;i<cart.length;i++){
              const it = cart[i];
              if (it.id === cartItem.id && JSON.stringify(it.additions||[]) === JSON.stringify(cartItem.additions||[]) && (it.primary||null) === (cartItem.primary||null)){
                it.qty = (Number(it.qty)||0) + cartItem.qty;
                it.price = cartItem.price;
                merged = true;
                break;
              }
            }
            if (!merged) cart.push(cartItem);
            localStorage.setItem('cart', JSON.stringify(cart));
          } catch(e){
            localStorage.setItem('cart', JSON.stringify([cartItem]));
          }

          feedback.textContent = 'Berhasil ditambahkan ke keranjang';
          feedback.classList.remove('hidden');
          setTimeout(()=> feedback.classList.add('hidden'), 1600);

          const toast = document.createElement('div');
          toast.textContent = `${item.title} ditambahkan (${qty})`;
          toast.className = 'fixed bottom-6 right-6 rounded-lg bg-black/80 text-white px-4 py-2 shadow-lg';
          document.body.appendChild(toast);
          setTimeout(()=> toast.remove(), 1600);

          try { localStorage.setItem('cart_updated_at', String(Date.now())); } catch(e){}
        });
      }

      initWhenReady();
    })();
  </script>
</body>
</html>
