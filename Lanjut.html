<script>
(function enhancePaymentSelection() {
  // classes visual
  const BORDER_SELECTED = 'border-[#FF9800]';
  const BG_SELECTED = 'bg-[#FFF7E6]';
  const TEXT_SELECTED = 'text-[#8a4b00]';
  const RING = 'ring-1';
  const RING_COLOR = 'ring-[#FF9800]';

  const CHECK_SVG = `<span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-white/80 ${RING} ${RING_COLOR}">
    <svg class="w-4 h-4 text-[#FF9800]" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M6 12.5L10 16.5L18 8.5" stroke="#FF9800" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>`;

  // find candidate buttons inside payment area:
  // strategy: select anything clickable inside #methods or .selectable or buttons inside payment sections
  let candidates = new Set();

  // 1) explicit selectable class
  document.querySelectorAll('.selectable').forEach(e => candidates.add(e));

  // 2) buttons inside #methods container
  const methodsContainer = document.getElementById('methods');
  if (methodsContainer) {
    methodsContainer.querySelectorAll('button, [role="button"]').forEach(e => candidates.add(e));
  }

  // 3) fallback: buttons in the area with common keywords
  document.querySelectorAll('button').forEach(b => {
    if (b.closest && (b.closest('[id^="methods"]') || b.closest('.payment') || b.closest('[data-method]'))) candidates.add(b);
  });

  // convert to array and filter out the confirm button etc.
  const allBtns = Array.from(candidates).filter(b => !b.matches('#confirm-btn, #to-payment, .no-select'));

  if (!allBtns.length) return;

  // ensure each has data-method (try to infer), and a check-slot
  allBtns.forEach((btn, idx) => {
    if (!btn.hasAttribute('data-method')) {
      // try infer from inner text or img alt
      const text = (btn.textContent || '').trim().toLowerCase();
      const img = btn.querySelector('img');
      let inferred = null;
      if (btn.classList.contains('va-btn') || text.includes('virtual') || text.includes('bca') || (img && (img.alt||'').toLowerCase().includes('bca'))) inferred = 'va';
      if (!inferred && text.includes('ovo')) inferred = 'ovo';
      if (!inferred && text.includes('gopay')) inferred = 'gopay';
      if (!inferred && text.includes('dana')) inferred = 'dana';
      if (!inferred && text.includes('linkaja')) inferred = 'linkaja';
      if (!inferred && text.includes('mandiri')) inferred = 'mandiri';
      if (!inferred && text.includes('bri')) inferred = 'bri';
      if (!inferred && text.includes('cod') || text.includes('tempat') || text.includes('tunai')) inferred = 'cod';
      if (!inferred) inferred = 'method-' + idx;
      btn.setAttribute('data-method', inferred);
    }

    // ensure check slot exists
    if (!btn.querySelector('.check-slot')) {
      const slot = document.createElement('span');
      slot.className = 'check-slot ml-auto hidden';
      btn.appendChild(slot);
    }

    // ensure buttons look consistent (have border class)
    if (!btn.classList.contains('border')) btn.classList.add('border', 'border-border-light');
    // make cursor pointer
    btn.style.cursor = 'pointer';
  });

  // clear selection helper
  function clearAll() {
    allBtns.forEach(b => {
      b.classList.remove(BORDER_SELECTED, BG_SELECTED, TEXT_SELECTED, RING, RING_COLOR);
      // ensure border-border-light present
      if (!b.classList.contains('border-border-light')) b.classList.add('border-border-light');
      const slot = b.querySelector('.check-slot');
      if (slot) { slot.innerHTML = ''; slot.classList.add('hidden'); }
    });
  }

  // select one
  function selectOne(btn) {
    clearAll();
    btn.classList.remove('border-border-light');
    btn.classList.add(BORDER_SELECTED, BG_SELECTED, TEXT_SELECTED, RING, RING_COLOR);
    const slot = btn.querySelector('.check-slot');
    if (slot) { slot.innerHTML = CHECK_SVG; slot.classList.remove('hidden'); } else {
      const s = document.createElement('span');
      s.className = 'ml-auto';
      s.innerHTML = CHECK_SVG;
      btn.appendChild(s);
    }
    // persist
    try { localStorage.setItem('paymentChoice', JSON.stringify({ method: btn.getAttribute('data-method'), at: new Date().toISOString() })); } catch (e){}
    // show details panel if exists by dispatching event
    window.dispatchEvent(new CustomEvent('payment:selected', { detail: { method: btn.getAttribute('data-method') } }));
  }

  // restore previous
  try {
    const prev = JSON.parse(localStorage.getItem('paymentChoice') || 'null');
    if (prev && prev.method) {
      const found = allBtns.find(b => b.getAttribute('data-method') === prev.method);
      if (found) selectOne(found);
    }
  } catch(e){}

  // attach click listeners
  allBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      // ignore clicks on disabled elements
      if (btn.disabled || btn.getAttribute('aria-disabled') === 'true') return;
      selectOne(btn);
    });
  });

  // Optional: when payment:selected is fired elsewhere, reflect UI
  window.addEventListener('payment:selected', (e) => {
    const method = e.detail?.method;
    if (!method) return;
    const target = allBtns.find(b => b.getAttribute('data-method') === method);
    if (target) selectOne(target);
  });
})();
</script>
