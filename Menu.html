    /* simple image placeholder style */
    .card-img {
      width: 100%;
      height: 0;
      padding-bottom: 56.25%;
      position: relative;
      overflow: hidden;
      background: #f3f4f6;
    }

    .card-img img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

      align-items: center;
      justify-content: center;
      color: #9CA3AF;

    }

      "burger-sapi-spesial": {id: "burger-sapi-spesial", title: "Burger Sapi Spesial", price: 35000, img: "Img/beefburgerspesial.png", desc: "Burger sapi spesial, dengan patty tebal, selada, tomat, bawang bombay, keju, dan saus mayo lada hitam.", category: "makanan"},

      // menu minuman
      "es-kopi-latte": { id: "es-kopi-latte", title: "Es Kopi Latte", price: 22000, img: "Img/Es Kopi Latte.png", desc: "Kopi espresso dengan susu segar", category: "minuman" },
      "es-teh-lemon": {id:"es-teh-lemon", title:"Es Teh Lemon", price: 15000, img: "Img/Es Teh Lemon.png", desc: "Es teh manis dengan persan jeruk lemon segar", category: "minuman"},
      "jus-jeruk": {id: "jus-jeruk", title: "Jus Jeruk", price: 10000, img: "Img/Jus Jeruk Segar.png", desc: "Persan buah jeruk asli segar", category: "minuman"},
      "cappucino-panas": {id: "cappucino-panas", title: "Cappucino Panas", price: 20000, img:"Img/hotcappucino.png", desc: "Kopi espresso nikmat dengan busa susu tebal", category: "minuman"},
      "ocean-blue-soda": {id: "ocean-blue-soda", title: "Ocean Blue Soda", price: 23000, img:"Img/Ocean Blue Soda.png", desc: "Soda biru nan segar, dengan campuran sirup leci", category: "minuman"},
      "jus-alpukat": {id: "jus-alpukat", title: "Jus Alpukat", price: 15000, img: "Img/jusalpukat.png", desc: "Dibuat dari alpukat pilihan, kaya serat dan vitamin. Rasa lezat, pas untuk gaya hidup sehat Anda.", category: "minuman"}

    /* ---------------------------
       HELPERS
       - normalizeUrl: decode repeated encodings then return a safe URL string
       - use <img> with onerror fallback
       --------------------------- */
    function formatRp(n) { return 'Rp' + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

    function normalizeUrl(u) {
      if (!u) return '';
      try {
        // strip backslashes and trim
        let s = u.replace(/\\/g, '').trim();
        // If s looks like an absolute URL, leave protocol intact
        const isAbs = /^[a-zA-Z][a-zA-Z\d+\-.]*:\/\//.test(s);
        // Repeatedly decode while it changes and until safe (prevent infinite loops)
        for (let i = 0; i < 5; i++) {
          try {
            const dec = decodeURIComponent(s);
            if (dec === s) break;
            s = dec;
          } catch { break; }
        }
        // If it's not absolute, keep relative path as-is but replace spaces with %20
        if (!isAbs) {
          // normalize multiple spaces and trim
          s = s.replace(/\s+/g, ' ');
          // we return raw path with spaces; browser will resolve when assigned to img.src
          // but to avoid server confusion, convert spaces to %20:
          s = s.split('/').map(part => encodeURIComponent(part)).join('/');
          // If path started with encoded protocol (rare), restore slashes
          if (s.startsWith('http%3A') || s.startsWith('https%3A')) {
            try { s = decodeURIComponent(s); } catch { }
          }
        } else {
          // absolute: encodeURI to safely include spaces etc.
          s = encodeURI(s);
        }
        return s;
      } catch (e) {
        console.warn('normalizeUrl error for', u, e);
        return u;
      }
    }

    const cardsEl = document.getElementById('cards');

    function renderCards(filter = { q: '', category: 'all' }) {
      const q = (filter.q || '').trim().toLowerCase();
      const cat = filter.category || 'all';
      cardsEl.innerHTML = '';

      const items = Object.values(MENU_DATA).filter(item => {
        if (cat !== 'all' && item.category !== cat) return false;
        if (!q) return true;
        const hay = (item.title + ' ' + (item.desc || '')).toLowerCase();
        return hay.includes(q);
      });

      if (items.length === 0) {
        cardsEl.innerHTML = '<div class="col-span-full text-center text-text-secondary py-12">Tidak ada item ditemukan</div>';
        return;
      }

      items.forEach(item => {
        const article = document.createElement('article');
        article.className = 'group overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm hover:shadow-lg transition flex flex-col';

        article.innerHTML = `
          <a href="menu_detail.html?id=${encodeURIComponent(item.id)}" class="block flex flex-col h-full">
            <div class="card-img">
              <img alt="${escapeHtml(item.title)}" loading="lazy" />
            </div>
            <div class="p-4 flex flex-col flex-1">
              <h4 class="text-lg font-semibold text-text-primary">${escapeHtml(item.title)}</h4>
              <p class="mt-1 text-sm text-text-secondary break-words">${escapeHtml(item.desc || '')}</p>
              <div class="mt-auto flex items-center justify-between gap-3">
                <p class="text-lg font-bold text-text-primary whitespace-nowrap">${formatRp(item.price)}</p>
                <button class="add-btn inline-flex items-center gap-2 rounded-lg h-10 px-4 bg-cta text-white text-sm font-semibold min-w-[84px]" type="button">
                  <span class="material-symbols-outlined">add_shopping_cart</span>Tambah
                </button>
              </div>
            </div>
          </a>
        `;
        cardsEl.appendChild(article);

        // set image src via DOM API and normalize URL to prevent double-encoding
        const imgEl = article.querySelector('img');
        const raw = item.img || '';
        const url = normalizeUrl(raw);

        // Debug log (comment out if noisy)
        console.debug('Setting image src for', item.id, '->', url);

        // assign src and handle errors with fallback
        imgEl.src = url;
        imgEl.addEventListener('error', (ev) => {
          // try one more time: if url contains %25 decode then set again
          try {
            const srcNow = imgEl.src || url;
            let tryUrl = srcNow;
            try { tryUrl = decodeURIComponent(tryUrl); } catch { }
            if (tryUrl !== srcNow) {
              console.debug('Retrying image with decoded URL:', tryUrl);
              imgEl.src = tryUrl;
              return;
            }
          } catch (e) { /* ignore */ }

          // final fallback: show placeholder block and log error with requested URL
          const wrapper = imgEl.closest('.card-img');
          if (wrapper) {
            wrapper.innerHTML = `<div class="img-fallback">Gambar tidak ditemukan</div>`;
          }
          console.warn('Image load failed for', raw, 'normalized->', url, 'final src->', imgEl.src);
        });
      });

      // attach add btn handlers (delegated per render)
      cardsEl.querySelectorAll('.add-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault(); e.stopPropagation();
          const card = btn.closest('article');
          const title = card?.querySelector('h4')?.textContent?.trim() || 'Item';
          const priceText = card?.querySelector('.text-lg.font-bold')?.textContent || '';
          const price = parseInt((priceText || '').replace(/\D/g, '')) || 0;
          const id = card?.querySelector('a')?.getAttribute('href')?.split('id=')[1] || title.toLowerCase().replace(/\s+/g, '-');
          const cart = JSON.parse(localStorage.getItem('cart') || '[]');
          cart.push({ id, title, price, qty: 1 });
          localStorage.setItem('cart', JSON.stringify(cart));
          const toast = document.createElement('div');
          toast.textContent = `${title} ditambahkan ke keranjang`;
          toast.className = 'fixed bottom-6 right-6 rounded-lg bg-black/80 text-white px-4 py-2 shadow-lg';
          document.body.appendChild(toast);
          setTimeout(() => toast.remove(), 1400);
        });
      });
    }

    // small helper to escape HTML inside strings we inject into innerHTML
    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, function (m) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]); });
    }

    // initial render
    renderCards({ q: '', category: 'all' });

    // search handler
    const searchInput = document.getElementById('search');
    let lastQ = '';
    if (searchInput) {
      searchInput.addEventListener('input', () => {
        lastQ = searchInput.value;
        renderCards({ q: lastQ, category: currentCategory });
      });
    }

    // category active styling + handlers
    let currentCategory = 'all';
    const catAllBtn = document.getElementById('cat-all');
    const catBtns = Array.from(document.querySelectorAll('.cat-btn'));

    function setActiveCategoryButton(cat) {
      catAllBtn.classList.remove('bg-primary', 'text-white');
      catAllBtn.classList.add('bg-background-secondary', 'text-text-primary');
      catBtns.forEach(b => { b.classList.remove('bg-primary', 'text-white'); b.classList.add('bg-background-secondary', 'text-text-primary'); });
      if (cat === 'all') { catAllBtn.classList.add('bg-primary', 'text-white'); catAllBtn.classList.remove('bg-background-secondary', 'text-text-primary'); }
      else {
        const match = catBtns.find(b => (b.dataset?.cat || '') === cat);
        if (match) { match.classList.add('bg-primary', 'text-white'); match.classList.remove('bg-background-secondary', 'text-text-primary'); }
      }
    }

    catAllBtn.addEventListener('click', () => {
      currentCategory = 'all'; setActiveCategoryButton(currentCategory); renderCards({ q: lastQ, category: currentCategory });
    });
    catBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset?.cat || 'all'; currentCategory = cat; setActiveCategoryButton(currentCategory); renderCards({ q: lastQ, category: currentCategory });
      });
    });
    setActiveCategoryButton(currentCategory);

    // mobile menu toggle
    const menuToggle = document.getElementById('menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    menuToggle?.addEventListener('click', (e) => { e.stopPropagation(); mobileMenu.classList.toggle('hidden'); });
    document.addEventListener('click', (e) => { if (!mobileMenu.contains(e.target) && !menuToggle.contains(e.target)) mobileMenu.classList.add('hidden'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') mobileMenu.classList.add('hidden'); });

    // expose MENU_DATA for debugging in console
    window.MENU_DATA = MENU_DATA;
  </script>
</body>
