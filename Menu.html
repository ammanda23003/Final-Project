<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Menu Makanan - Resto Modern</title>

  <!-- Tailwind + fonts -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" crossorigin href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#4CAF50",
            cta: "#FF9800",
            "background-light": "#FFFFFF",
            "background-secondary": "#F5F5F5",
            "text-primary": "#1F2937",
            "text-secondary": "#6B7280"
          },
          fontFamily: { display: ["Poppins", "sans-serif"] }
        }
      }
    };
  </script>

  <!-- minimal fallback for aspect ratio if Tailwind build lacks aspect utilities -->
  <style>.pb-56-25{padding-bottom:56.25%}</style>
</head>
<body class="min-h-screen flex flex-col bg-background-light font-display text-text-primary">
  <div class="flex flex-col flex-1">
    <header class="sticky top-0 z-20 w-full border-b border-gray-200 bg-background-light">
      <div class="container mx-auto flex h-20 items-center justify-between px-4 sm:px-6 lg:px-8">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-primary text-4xl">restaurant_menu</span>
          <h1 class="text-2xl font-bold">Resto Modern</h1>
        </div>

        <nav class="hidden md:flex items-center gap-6">
          <a class="text-base font-medium hover:text-primary" href="index.html">Home</a>
          <a class="text-base font-medium hover:text-primary" href="Promo.html">Promo</a>
          <a class="text-base font-medium hover:text-primary" href="Menu_favorit.html">Favorit</a>
          <a class="text-base font-medium hover:text-primary" href="Bantuan.html">Bantuan</a>

          <!-- cart link: badge injected by script -->
          <a id="header-cart-link" aria-label="Keranjang Belanja" class="inline-flex items-center gap-2 hover:text-primary" href="cart.html">
            <span class="material-symbols-outlined text-2xl">shopping_cart</span>
          </a>
        </nav>

        <button id="menu-toggle" class="md:hidden p-2 rounded-md" aria-label="Buka menu">
          <span class="material-symbols-outlined text-3xl">menu</span>
        </button>

        <nav id="mobile-menu" class="hidden absolute right-4 top-full mt-2 w-56 rounded-xl border bg-white shadow-lg overflow-hidden md:hidden">
          <ul class="flex flex-col py-2">
            <li><a class="block px-4 py-2 hover:bg-gray-100" href="index.html">Home</a></li>
            <li><a class="block px-4 py-2 hover:bg-gray-100" href="Promo.html">Promo</a></li>
            <li><a class="block px-4 py-2 hover:bg-gray-100" href="Menu_favorit.html">Favorit</a></li>
            <li><a class="block px-4 py-2 hover:bg-gray-100" href="Bantuan.html">Bantuan</a></li>
            <li><a class="flex items-center gap-2 px-4 py-2 hover:bg-gray-100" href="cart.html"><span class="material-symbols-outlined">shopping_cart</span>Keranjang</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="flex-grow container mx-auto p-4 gap-6">
      <section class="mb-6">
        <div class="space-y-4">
          <div class="relative">
            <label class="flex">
              <div class="flex items-center justify-center pl-3 pr-3 rounded-l-lg bg-white border border-r-0 border-gray-300 text-gray-500">
                <span class="material-symbols-outlined">search</span>
              </div>
              <input id="search" class="flex-1 min-w-0 px-4 py-3 rounded-r-lg border border-gray-300 focus:outline-0" placeholder="Cari menu..." />
            </label>
          </div>

          <div id="categories" class="flex gap-3 overflow-x-auto pb-2">
            <button id="cat-all" data-cat="all" class="cat-btn flex h-10 shrink-0 items-center justify-center rounded-full px-5 bg-primary text-white text-sm font-medium">Semua</button>
            <button data-cat="makanan" class="cat-btn flex h-10 shrink-0 items-center justify-center rounded-full px-5 bg-background-secondary text-text-primary text-sm font-medium">Makanan</button>
            <button data-cat="minuman" class="cat-btn flex h-10 shrink-0 items-center justify-center rounded-full px-5 bg-background-secondary text-text-primary text-sm font-medium">Minuman</button>
            <button data-cat="paket" class="cat-btn flex h-10 shrink-0 items-center justify-center rounded-full px-5 bg-background-secondary text-text-primary text-sm font-medium">Paket</button>
            <button data-cat="snack" class="cat-btn flex h-10 shrink-0 items-center justify-center rounded-full px-5 bg-background-secondary text-text-primary text-sm font-medium">Snack</button>
          </div>
        </div>
      </section>

      <section>
        <div id="cards" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
          <!-- cards injected by JS -->
        </div>
      </section>
    </main>

    <footer class="w-full border-t border-gray-200 bg-background-secondary">
      <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-6">
        <div class="flex flex-col md:flex-row items-center md:items-start justify-between text-center md:text-left gap-2 md:gap-4">
          <div class="text-xs md:text-sm text-text-secondary">
            <p class="font-semibold text-text-primary">Resto Modern</p>
            <p class="mt-1">Jl. Teknologi No. 1, Jakarta, Indonesia</p>
          </div>
          <div class="flex gap-4 text-xs md:text-sm mt-2 md:mt-0">
            <a class="text-text-secondary hover:text-primary" href="Bantuan.html">Bantuan</a>
            <a class="text-text-secondary hover:text-primary" href="FAQ.html">FAQ</a>
          </div>
          <p class="text-xs md:text-sm text-text-secondary mt-2 md:mt-0">© 2025 Smart Ordering System</p>
        </div>
      </div>
    </footer>
  </div>

  <!-- load shared data first (adjust path jika perlu) -->
  <script src="data.js"></script>

  <script>
    /* ---------- Helpers ---------- */
    function formatRp(n) { return 'Rp ' + Number(n || 0).toLocaleString('id-ID'); }
    function escapeHtml(str) { return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function normalizeUrl(u) {
      if (!u) return '';
      try {
        let s = u.replace(/\\/g, '').trim();
        for (let i = 0; i < 3; i++) {
          try { const d = decodeURIComponent(s); if (d === s) break; s = d; } catch { break; }
        }
        const isAbs = /^[a-zA-Z][a-zA-Z\d+\-.]*:\/\//.test(s);
        if (!isAbs) s = s.split('/').map(p => encodeURIComponent(p)).join('/');
        else s = encodeURI(s);
        return s;
      } catch { return u; }
    }

    /* ---------- Cart helpers ---------- */
    function readCart() { try { return JSON.parse(localStorage.getItem('cart') || '[]'); } catch { return []; } }
    function writeCart(cart) { localStorage.setItem('cart', JSON.stringify(cart)); }
    function findCartIndexById(cart, id) { return cart.findIndex(x => x.id === id); }
    function hasInCart(id) { return findCartIndexById(readCart(), id) !== -1; }

    /* ---------- Data source ---------- */
    // MENU_DATA comes from data.js as window.MENU_DATA
    const MENU = window.MENU_DATA || {};

    /* ---------- DOM refs ---------- */
    const cardsEl = document.getElementById('cards');
    const catAllBtn = document.getElementById('cat-all');
    const catBtns = Array.from(document.querySelectorAll('.cat-btn'));
    const searchInput = document.getElementById('search');

    /* ---------- Render logic ---------- */
    function createCartBadge() {
      const b = document.createElement('div');
      b.className = 'absolute top-2 left-2 bg-primary text-white text-xs font-semibold px-2 py-0.5 rounded-full pointer-events-none';
      b.textContent = 'Dalam keranjang';
      return b;
    }

    function renderCards({ q = '', category = 'all' } = {}) {
      const ql = (q || '').trim().toLowerCase();
      cardsEl.innerHTML = '';

      const items = Object.values(MENU).filter(item => {
        // category filter
        if (category !== 'all' && item.category !== category) return false;
        // search filter
        if (!ql) return true;
        return (item.title + ' ' + (item.desc || '')).toLowerCase().includes(ql);
      });

      if (items.length === 0) {
        cardsEl.innerHTML = '<div class="col-span-full text-center text-text-secondary py-12">Tidak ada item ditemukan</div>';
        return;
      }

      const cart = readCart();

      items.forEach(item => {
        const url = normalizeUrl(item.img || '');
        const article = document.createElement('article');
        article.className = 'group relative overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm hover:shadow-lg transition flex flex-col';

        article.innerHTML = `
          <a href="menu_detail.html?id=${encodeURIComponent(item.id)}" class="block flex flex-col h-full">
            <div class="relative w-full overflow-hidden bg-gray-100">
              <div class="${CSS && CSS.supports && CSS.supports('aspect-ratio:16/9') ? 'aspect-[16/9]' : 'pb-56-25'} w-full bg-center bg-cover">
                <img alt="${escapeHtml(item.title)}" loading="lazy" class="w-full h-full object-cover block" />
              </div>
            </div>
            <div class="p-4 flex flex-col flex-1">
              <h4 class="text-lg font-semibold text-text-primary">${escapeHtml(item.title)}</h4>
              <p class="mt-1 text-sm text-text-secondary break-words">${escapeHtml(item.desc || '')}</p>
              <div class="mt-auto flex items-center justify-between gap-3">
                <p class="text-lg font-bold text-text-primary whitespace-nowrap">${formatRp(item.price)}</p>
                <button class="add-btn inline-flex items-center gap-2 rounded-lg h-10 px-4 bg-cta text-white text-sm font-semibold min-w-[84px]" type="button">
                  <span class="material-symbols-outlined">add_shopping_cart</span>
                  Tambah
                </button>
              </div>
            </div>
          </a>
        `;

        cardsEl.appendChild(article);

        // set image src and fallback
        const imgEl = article.querySelector('img');
        imgEl.src = url;
        imgEl.addEventListener('error', () => {
          try { const dec = decodeURIComponent(imgEl.src); if (dec !== imgEl.src) { imgEl.src = dec; return; } } catch {}
          const wrap = imgEl.closest('div.w-full');
          if (wrap) wrap.innerHTML = '<div class="flex items-center justify-center text-sm text-gray-400 w-full h-full">Gambar tidak ditemukan</div>';
        });

        // badge "Dalam keranjang" if in cart
        if (cart.find(c => c.id === item.id)) {
          const badge = createCartBadge();
          article.querySelector('.relative')?.appendChild(badge);
        }
      });

      // attach add handlers
      cardsEl.querySelectorAll('.add-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const article = btn.closest('article');
          const idParam = article?.querySelector('a')?.getAttribute('href')?.split('id=')[1];
          const id = idParam || article?.querySelector('h4')?.textContent?.trim().toLowerCase().replace(/\s+/g, '-');
          const title = article?.querySelector('h4')?.textContent?.trim() || 'Item';
          const priceText = article?.querySelector('.text-lg.font-bold')?.textContent || '';
          const price = parseInt((priceText || '').replace(/\D/g, '')) || 0;
          const imgEl = article.querySelector('img');
          const imgSrc = imgEl?.src || '';

          const cart = readCart();
          const idx = findCartIndexById(cart, id);
          if (idx === -1) {
            cart.push({ id, title, price, qty: 1, img: imgSrc });
            writeCart(cart);
            const existingBadge = article.querySelector('.absolute.top-2.left-2');
            if (!existingBadge) {
              const badge = createCartBadge();
              article.querySelector('.relative')?.appendChild(badge);
            }
          } else {
            cart[idx].qty = (Number(cart[idx].qty) || 1) + 1;
            cart[idx].img = cart[idx].img || imgSrc;
            writeCart(cart);
          }

          const toast = document.createElement('div');
          toast.textContent = `${title} ditambahkan ke keranjang`;
          toast.className = 'fixed bottom-6 right-6 rounded-lg bg-black/80 text-white px-4 py-2 shadow-lg';
          document.body.appendChild(toast);
          setTimeout(() => toast.remove(), 1400);

          updateCartCountIndicator();
        });
      });
    }

    /* ---------- Category active handling ---------- */
    const allCategoryButtons = [catAllBtn].concat(catBtns);
    function setActiveCategoryButton(cat) {
      allCategoryButtons.forEach(b => {
        b.classList.remove('bg-primary', 'text-white');
        b.classList.add('bg-background-secondary', 'text-text-primary');
      });
      if (cat === 'all') {
        catAllBtn.classList.remove('bg-background-secondary', 'text-text-primary');
        catAllBtn.classList.add('bg-primary', 'text-white');
      } else {
        const match = catBtns.find(b => (b.dataset?.cat || '') === cat);
        if (match) {
          match.classList.remove('bg-background-secondary', 'text-text-primary');
          match.classList.add('bg-primary', 'text-white');
        }
      }
    }

    /* ---------- Header cart inline badge ---------- */
    function updateCartCountIndicator() {
      const cart = readCart();
      const cnt = cart.reduce((s, x) => s + (Number(x.qty) || 0), 0);
      const headerCartLink = document.getElementById('header-cart-link');
      if (!headerCartLink) return;
      let badge = headerCartLink.querySelector('#header-cart-badge');
      if (!badge) {
        badge = document.createElement('span');
        badge.id = 'header-cart-badge';
        badge.className = 'hidden items-center justify-center bg-red-600 text-white text-xs font-semibold rounded-full px-2 h-5';
        headerCartLink.insertBefore(badge, headerCartLink.firstChild);
      }
      if (cnt > 0) {
        badge.textContent = cnt > 99 ? '99+' : String(cnt);
        badge.classList.remove('hidden');
      } else {
        badge.textContent = '';
        badge.classList.add('hidden');
      }
    }

    (function initHeaderCartBadge() {
      const headerCartLink = document.getElementById('header-cart-link');
      if (!headerCartLink) return;
      headerCartLink.classList.add('inline-flex', 'items-center', 'gap-2');
      updateCartCountIndicator();
    })();

    /* ---------- Init, wire events ---------- */
    let currentCategory = 'all';
    setActiveCategoryButton(currentCategory);
    renderCards({ q: '', category: currentCategory });

    let lastQ = '';
    searchInput?.addEventListener('input', (e) => {
      lastQ = e.target.value;
      renderCards({ q: lastQ, category: currentCategory });
    });

    catAllBtn.addEventListener('click', () => {
      currentCategory = 'all';
      setActiveCategoryButton(currentCategory);
      renderCards({ q: lastQ, category: currentCategory });
    });

    catBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset?.cat || 'all';
        currentCategory = cat;
        setActiveCategoryButton(currentCategory);
        renderCards({ q: lastQ, category: currentCategory });
      });
    });

    // mobile menu toggle
    const menuToggle = document.getElementById('menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    menuToggle?.addEventListener('click', (e) => { e.stopPropagation(); mobileMenu.classList.toggle('hidden'); });
    document.addEventListener('click', (e) => { if (mobileMenu && !mobileMenu.contains(e.target) && !menuToggle.contains(e.target)) mobileMenu.classList.add('hidden'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') mobileMenu.classList.add('hidden'); });

    // sync when other tabs update cart
    window.addEventListener('storage', (e) => {
      if (e.key === 'cart') {
        renderCards({ q: lastQ, category: currentCategory });
        updateCartCountIndicator();
      }
    });

    // expose MENU for debugging
    window.MENU = MENU;
  </script>
</body>
</html>
