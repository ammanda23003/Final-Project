    // ------- Helpers -------
    function formatRp(n) {
      return 'Rp' + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function safeUrl(u) {
        if (!u) return '';
        try {
          // hapus backslash, trim, lalu ganti spasi beruntun jadi satu %20
          const cleaned = u.replace(/\\/g, '').trim().replace(/\s+/g, '%20');
          return encodeURI(cleaned);
        } catch {
          return u;
        }
      }

    // ------- Render cards from MENU_DATA -------
    const cardsEl = document.getElementById('cards');

    function renderCards(filter = { q: '', category: 'all' }) {
      const q = (filter.q || '').trim().toLowerCase();
      const cat = filter.category || 'all';
      cardsEl.innerHTML = '';

      const items = Object.values(MENU_DATA).filter(item => {
        if (cat !== 'all' && item.category !== cat) return false;
        if (!q) return true;
        const hay = (item.title + ' ' + (item.desc || '')).toLowerCase();
        return hay.includes(q);
      });

      if (items.length === 0) {
        cardsEl.innerHTML = '<div class="col-span-full text-center text-text-secondary py-12">Tidak ada item ditemukan</div>';
        return;
      }

      items.forEach(item => {
        const url = safeUrl(item.img) || '';
        const article = document.createElement('article');
        article.className = 'group overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm hover:shadow-lg transition flex flex-col';
        article.innerHTML = `
          <a href="menu_detail.html?id=${encodeURIComponent(item.id)}" class="block flex flex-col h-full">
            <div class="w-full aspect-[16/9] bg-center bg-cover" style="background-image:url('${url}')"></div>
            <div class="p-4 flex flex-col flex-1">
              <h4 class="text-lg font-semibold text-text-primary">${item.title}</h4>
              <p class="mt-1 text-sm text-text-secondary break-words">${item.desc || ''}</p>

              <div class="mt-auto flex items-center justify-between gap-3">
                <p class="text-lg font-bold text-text-primary whitespace-nowrap">${formatRp(item.price)}</p>
                <button class="add-btn inline-flex items-center gap-2 rounded-lg h-10 px-4 bg-cta text-white text-sm font-semibold min-w-[84px]" type="button">
                  <span class="material-symbols-outlined">add_shopping_cart</span>
                  Tambah
                </button>
              </div>
            </div>
          </a>
        `;
        cardsEl.appendChild(article);
      });

      // attach add btn handlers
      cardsEl.querySelectorAll('.add-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const card = btn.closest('article');
          const title = card?.querySelector('h4')?.textContent?.trim() || 'Item';
          const priceText = card?.querySelector('.text-lg.font-bold')?.textContent || '';
          const price = parseInt((priceText||'').replace(/\D/g,'')) || 0;
          const id = card?.querySelector('a')?.getAttribute('href')?.split('id=')[1] || title.toLowerCase().replace(/\s+/g,'-');
          const cart = JSON.parse(localStorage.getItem('cart') || '[]');
          cart.push({ id, title, price, qty: 1 });
          localStorage.setItem('cart', JSON.stringify(cart));
          const toast = document.createElement('div');
          toast.textContent = `${title} ditambahkan ke keranjang`;
          toast.className = 'fixed bottom-6 right-6 rounded-lg bg-black/80 text-white px-4 py-2 shadow-lg';
          document.body.appendChild(toast);
          setTimeout(()=>toast.remove(), 1400);
        });
      });
    }

    // initial render (all)
    renderCards({ q: '', category: 'all' });

    // ------- Search -------
    const searchInput = document.getElementById('search');
    let lastQ = '';
    if (searchInput) {
      searchInput.addEventListener('input', () => {
        lastQ = searchInput.value;
        renderCards({ q: lastQ, category: currentCategory });
      });
    }

    // ------- Category filter (with active styling) -------
    let currentCategory = 'all';
    const catAllBtn = document.getElementById('cat-all');
    const catBtns = Array.from(document.querySelectorAll('.cat-btn'));

    function setActiveCategoryButton(cat) {
      // reset all to default
      catAllBtn.classList.remove('bg-primary','text-white');
      catAllBtn.classList.add('bg-background-secondary','text-text-primary');

      catBtns.forEach(b => {
        b.classList.remove('bg-primary','text-white');
        b.classList.add('bg-background-secondary','text-text-primary');
      });

      // activate selected
      if (cat === 'all') {
        catAllBtn.classList.add('bg-primary','text-white');
        catAllBtn.classList.remove('bg-background-secondary','text-text-primary');
      } else {
        const match = catBtns.find(b => (b.dataset?.cat || '') === cat);
        if (match) {
          match.classList.add('bg-primary','text-white');
          match.classList.remove('bg-background-secondary','text-text-primary');
        }
      }
    }

    // attach handlers using the new helper
    catAllBtn.addEventListener('click', () => {
      currentCategory = 'all';
      setActiveCategoryButton(currentCategory);
      renderCards({ q: lastQ, category: currentCategory });
    });

    catBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset.cat || 'all';
        currentCategory = cat;
        setActiveCategoryButton(currentCategory);
        renderCards({ q: lastQ, category: currentCategory });
      });
    });

    // initialize active state
    setActiveCategoryButton(currentCategory);

    // ------- Mobile menu toggle -------
    const menuToggle = document.getElementById('menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    menuToggle?.addEventListener('click', (e) => {
      e.stopPropagation();
      mobileMenu.classList.toggle('hidden');
    });
    document.addEventListener('click', (e) => {
      if (!mobileMenu.contains(e.target) && !menuToggle.contains(e.target)) {
        mobileMenu.classList.add('hidden');
      }
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') mobileMenu.classList.add('hidden'); });

    // encode background-image urls that contain spaces (fallback)
    function encodeBackgroundImages() {
      document.querySelectorAll('[style]').forEach(el => {
        const s = el.getAttribute('style') || '';
        const m = s.match(/background-image:\s*url\(["']?(.*?)["']?\)/);
        if (m) {
          try {
            const raw = m[1].replace(/\\/g, '');
            const encoded = encodeURI(raw);
            el.setAttribute('style', s.replace(m[0], `background-image: url("${encoded}")`));
          } catch {}
        }
      });
    }
    // run after a tick (cards generated)
    setTimeout(encodeBackgroundImages, 80);

    // expose MENU_DATA globally for quick editing from console (optional)
    window.MENU_DATA = MENU_DATA;
